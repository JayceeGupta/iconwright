name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test (icon creation works on every OS)
        run: node bin/iconwright.mjs make test/fixtures/logo.svg --name ci --out ci-out --style "color=#3b82f6 bg=#ffffff shape=squircle" --formats ico,icns,web
      - name: Windows commands refuse cleanly off Windows
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if node bin/iconwright.mjs status 2> err.txt; then echo "status should fail off Windows"; exit 1; fi
          grep -q "only runs on Windows" err.txt

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem scripts/win/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
          }
      - name: C# helper compiles and doctor runs (read-only)
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/win/iconwright.ps1 doctor
          $out
          $r = $out | ConvertFrom-Json
          if (-not $r.checks.interop.ok) { exit 1 }
